name: Servo7
description: >-
  Servo7 is a Y Combinator-backed warehouse robotics company that builds
  AI-powered robots for automating physical material-handling tasks such as
  loose-loaded container unloading, mixed-pallet palletizing, depalletizing,
  sortation, and case handling (up to a 20kg payload). Its differentiator is a
  no-code, demonstration-based deployment model in which an operator shows the
  robot the task to automate, with no engineers or integration project and no
  facility redesign required. Servo7 works with logistics providers including
  CEVA, Stord, DHL, and PostNL. It is a physical-robotics/hardware company and
  does not currently publish a public developer API, SDK, or developer portal.
